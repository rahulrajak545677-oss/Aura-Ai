name: Unzip and Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unzip-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted_src
          ZIP_PATH=$(find . -maxdepth 3 -iname "*aura*ai*.zip" -o -iname "*.zip" | head -n 1)
          echo "Detected ZIP path: ${ZIP_PATH:-<none>}"
          test -n "$ZIP_PATH"
          unzip -o "$ZIP_PATH" -d extracted_src

          INNER_ZIP=$(find extracted_src -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$INNER_ZIP" ]; then
            echo "Detected nested ZIP: $INNER_ZIP"
            unzip -o "$INNER_ZIP" -d extracted_src
          fi

          SETTINGS_FILE=$(find extracted_src -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
          echo "Detected settings.gradle.kts: ${SETTINGS_FILE:-<none>}"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          # Ensure @mipmap/ic_launcher and @mipmap/ic_launcher_round exist
          RES_DIR="$PROJECT_DIR/app/src/main/res"
          mkdir -p "$RES_DIR/drawable" "$RES_DIR/mipmap-anydpi-v26"
          cat << 'EOF' > "$RES_DIR/drawable/ic_launcher_bg.xml"
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#080D18" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF
          cat << 'EOF' > "$RES_DIR/drawable/ic_launcher_fg.xml"
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#299BFF" android:pathData="M54,26L76,82H65L59,66H49L43,82H32L54,26ZM54,43L51,57H57L54,43Z"/>
          </vector>
          EOF
          for name in ic_launcher ic_launcher_round; do
            cat << 'EOF' > "$RES_DIR/mipmap-anydpi-v26/${name}.xml"
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_bg"/>
            <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          EOF
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" | head -n 1)
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-ai-debug-apk
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          
