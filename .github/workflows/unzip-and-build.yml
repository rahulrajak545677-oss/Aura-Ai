name: Unzip and Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unzip-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted_src
          ZIP_PATH=$(find . -maxdepth 3 -iname "*aura*ai*.zip" -o -iname "*.zip" | head -n 1)
          echo "Detected ZIP path: ${ZIP_PATH:-<none>}"
          test -n "$ZIP_PATH"
          unzip -o "$ZIP_PATH" -d extracted_src

          # If the archive contained a nested .zip, extract it too
          INNER_ZIP=$(find extracted_src -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$INNER_ZIP" ]; then
            echo "Detected nested ZIP: $INNER_ZIP"
            unzip -o "$INNER_ZIP" -d extracted_src
          fi

          SETTINGS_FILE=$(find extracted_src -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
          echo "Detected settings.gradle.kts: ${SETTINGS_FILE:-<none>}"
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" | head -n 1)
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-ai-debug-apk
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          
