name: Unzip and Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unzip-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p extracted_src
          echo "=== Repository root files ==="
          ls -la
          ZIP_PATH=$(find . -maxdepth 3 -iname "*aura*ai*.zip" -o -iname "*.zip" | head -n 1)
          echo "Detected ZIP path: ${ZIP_PATH:-<none>}"
          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: No .zip file found in repository. Upload aura_ai_github_apk_v2.zip and re-run."
            exit 1
          fi
          unzip -o "$ZIP_PATH" -d extracted_src
          echo "=== Extracted contents ==="
          ls -la extracted_src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        working-directory: extracted_src
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-ai-debug-apk
          path: extracted_src/app/build/outputs/apk/debug/*.apk
          
