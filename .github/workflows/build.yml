
name: AURA AI Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -name "AURA_AI*.zip" -o -name "AuraAI*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: AURA AI project ZIP not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "PROJECT_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q "$PROJECT_ZIP" -d extracted

      - name: Locate Android Gradle project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Android project found: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Align Java and Kotlin JVM targets to 17
        shell: bash
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          echo "Java 17 must be configured in the Android Gradle project."
          echo "Checking project configuration..."

          grep -nE "sourceCompatibility|targetCompatibility|jvmTarget|jvmToolchain" "$FILE" || true

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-AI-debug-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
