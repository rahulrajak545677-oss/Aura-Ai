
name: AURA AI Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract uploaded project ZIP
        run: |
          mkdir extracted
          ZIP_FILE=$(find . -maxdepth 2 -name "AURA_AI*.zip" -o -name "AuraAI*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android project
        run: |
          SETTINGS=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-AI-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
